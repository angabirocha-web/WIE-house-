<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
    getFirestore,
    collection,
    getDocs,
    addDoc,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


const firebaseConfig = {

    apiKey:"AIzaSyD08FRkhJVvqvSr3FR4AuYfPL4Pr6vO0qk",

    authDomain:"house-wie-6c8f9.firebaseapp.com",

    projectId:"house-wie-6c8f9",

    storageBucket:"house-wie-6c8f9.firebasestorage.app",

    messagingSenderId:"241202380170",

    appId:"1:241202380170:web:b7df00f3faa8ae7afedc73"

};


const app = initializeApp(firebaseConfig);

const db = getFirestore(app);


/* =========================
   ELEMENTOS
========================= */

const form =
    document.getElementById("fichaForm");

const nomeInput =
    document.getElementById("nome");

const idadeInput =
    document.getElementById("idade");

const personagemInput =
    document.getElementById("personagem");

const obraInput =
    document.getElementById("obra");

const fotoInput =
    document.getElementById("foto");

const preview =
    document.getElementById("preview");

const message =
    document.getElementById("message");

const submitBtn =
    document.getElementById("submitBtn");

const abertas =
    document.getElementById("vagasAbertas");

const fechadas =
    document.getElementById("vagasFechadas");


let vagasAtuais = [];

let vagasCarregadas = false;


/* =========================
   NORMALIZAÇÃO
========================= */

function normalizar(texto){

    return String(texto || "")
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g,"")
        .trim()
        .toLowerCase()
        .replace(/\s+/g," ");

}


function chavePersonagem(personagem, obra){

    return (
        normalizar(personagem)
        + "___"
        + normalizar(obra)
    );

}


/* =========================
   ESCAPE
========================= */

function escapeHtml(valor){

    return String(valor || "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =========================
   MENSAGEM
========================= */

function mostrarMensagem(texto,tipo){

    message.textContent = texto;

    message.className =
        "message " + tipo;

}


function limparMensagem(){

    message.textContent = "";

    message.className = "message";

}


/* =========================
   PRÉVIA DA FOTO
========================= */

fotoInput.addEventListener(
    "change",
    ()=>{

        const arquivo =
            fotoInput.files[0];

        if(!arquivo){

            preview.src = "";

            preview.style.display = "none";

            return;

        }


        if(!arquivo.type.startsWith("image/")){

            fotoInput.value = "";

            preview.src = "";

            preview.style.display = "none";

            mostrarMensagem(
                "❌ Selecione uma imagem válida.",
                "error"
            );

            return;

        }


        const reader =
            new FileReader();


        reader.onload = event => {

            preview.src =
                event.target.result;

            preview.style.display =
                "block";

        };


        reader.readAsDataURL(arquivo);

    }
);


/* =========================
   COMPRIMIR FOTO
========================= */

function comprimirImagem(file){

    return new Promise(
        (resolve,reject)=>{

            const reader =
                new FileReader();


            reader.onload = event => {

                const img =
                    new Image();


                img.onload = ()=>{

                    const max = 500;

                    let width =
                        img.width;

                    let height =
                        img.height;


                    if(width > height){

                        if(width > max){

                            height =
                                Math.round(
                                    height * max / width
                                );

                            width = max;

                        }

                    }else{

                        if(height > max){

                            width =
                                Math.round(
                                    width * max / height
                                );

                            height = max;

                        }

                    }


                    const canvas =
                        document.createElement(
                            "canvas"
                        );


                    canvas.width =
                        width;

                    canvas.height =
                        height;


                    const ctx =
                        canvas.getContext("2d");


                    ctx.drawImage(
                        img,
                        0,
                        0,
                        width,
                        height
                    );


                    canvas.toBlob(
                        blob => {

                            if(!blob){

                                reject(
                                    new Error(
                                        "PHOTO_ERROR"
                                    )
                                );

                                return;

                            }


                            const finalReader =
                                new FileReader();


                            finalReader.onload =
                                ()=>{
                                    resolve(
                                        finalReader.result
                                    );
                                };


                            finalReader.onerror =
                                reject;


                            finalReader.readAsDataURL(
                                blob
                            );

                        },
                        "image/jpeg",
                        .55
                    );

                };


                img.onerror =
                    ()=>reject(
                        new Error("PHOTO_ERROR")
                    );


                img.src =
                    event.target.result;

            };


            reader.onerror =
                ()=>reject(
                    new Error("PHOTO_ERROR")
                );


            reader.readAsDataURL(file);

        }
    );

}


/* =========================
   CARREGAR VAGAS
========================= */

async function carregarVagas(){

    try{

        const snapshot =
            await getDocs(
                collection(
                    db,
                    "vacancies"
                )
            );


        vagasAtuais = [];


        snapshot.forEach(item=>{

            vagasAtuais.push({

                id:item.id,

                ...item.data()

            });

        });


        vagasCarregadas = true;

        renderizarVagas();

    }catch(error){

        console.error(
            "Erro ao carregar vagas:",
            error
        );


        vagasCarregadas = false;


        abertas.innerHTML = `
            <div class="empty">
                Não foi possível carregar as vagas.
            </div>
        `;


        fechadas.innerHTML = `
            <div class="empty">
                Não foi possível carregar as vagas.
            </div>
        `;

    }

}


/* =========================
   IMAGEM DA VAGA
========================= */

function imagemHtml(vaga){

    if(!vaga.imagem){

        return `
            <div
                class="vaga-image"
                style="
                    display:flex;
                    align-items:center;
                    justify-content:center;
                    font-size:22px;
                "
            >
                🎭
            </div>
        `;

    }


    return `
        <img
            class="vaga-image"
            src="${escapeHtml(vaga.imagem)}"
            alt=""
        >
    `;

}


/* =========================
   CARD ABERTO
========================= */

function criarCardAberto(vaga){

    const card =
        document.createElement("div");


    card.className =
        "vaga-card";


    card.innerHTML = `

        ${imagemHtml(vaga)}

        <div class="vaga-info">

            <strong>
                ${escapeHtml(
                    vaga.personagem ||
                    "Personagem"
                )}
            </strong>

            <span>
                ${escapeHtml(
                    vaga.obra ||
                    "Obra não informada"
                )}
            </span>

        </div>

        <button
            class="vaga-button"
            type="button"
        >
            Escolher
        </button>

    `;


    card
        .querySelector("button")
        .addEventListener(
            "click",
            ()=>{

                personagemInput.value =
                    vaga.personagem || "";

                obraInput.value =
                    vaga.obra || "";


                document
                    .querySelector(".form-card")
                    .scrollIntoView({
                        behavior:"smooth",
                        block:"center"
                    });


                personagemInput.focus();

            }
        );


    return card;

}


/* =========================
   CARD FECHADO
========================= */

function criarCardFechado(vaga){

    const card =
        document.createElement("div");


    card.className =
        "vaga-card closed-card";


    card.innerHTML = `

        ${imagemHtml(vaga)}

        <div class="vaga-info">

            <strong>
                ${escapeHtml(
                    vaga.personagem ||
                    "Personagem"
                )}
            </strong>

            <span>
                ${escapeHtml(
                    vaga.obra ||
                    "Obra não informada"
                )}
            </span>

        </div>

        <span class="closed-label">
            🔒 OCUPADO
        </span>

    `;


    return card;

}


/* =========================
   RENDERIZAR VAGAS
========================= */

function renderizarVagas(){

    abertas.innerHTML = "";

    fechadas.innerHTML = "";


    const abertasArray =
        vagasAtuais.filter(
            vaga =>
                String(
                    vaga.status ||
                    "aberta"
                ).toLowerCase()
                === "aberta"
        );


    const fechadasArray =
        vagasAtuais.filter(
            vaga =>
                String(
                    vaga.status ||
                    ""
                ).toLowerCase()
                === "fechada"
        );


    if(abertasArray.length === 0){

        abertas.innerHTML = `
            <div class="empty">
                Nenhuma vaga aberta anunciada no momento.
            </div>
        `;

    }else{

        abertasArray.forEach(vaga=>{

            abertas.appendChild(
                criarCardAberto(vaga)
            );

        });

    }


    if(fechadasArray.length === 0){

        fechadas.innerHTML = `
            <div class="empty">
                Nenhuma vaga fechada anunciada.
            </div>
        `;

    }else{

        fechadasArray.forEach(vaga=>{

            fechadas.appendChild(
                criarCardFechado(vaga)
            );

        });

    }

}


/* =========================
   ENCONTRAR VAGA
========================= */

function encontrarVaga(
    personagem,
    obra
){

    const chave =
        chavePersonagem(
            personagem,
            obra
        );


    return vagasAtuais.find(
        vaga => {

            return chavePersonagem(
                vaga.personagem,
                vaga.obra
            ) === chave;

        }
    );

}


/* =========================
   ENVIAR FICHA
========================= */

form.addEventListener(
    "submit",
    async event => {

        event.preventDefault();

        limparMensagem();


        const nome =
            nomeInput.value.trim();

        const idade =
            idadeInput.value.trim();

        const personagem =
            personagemInput.value.trim();

        const obra =
            obraInput.value.trim();

        const foto =
            fotoInput.files[0];


        if(
            !nome ||
            !idade ||
            !personagem ||
            !obra ||
            !foto
        ){

            mostrarMensagem(
                "❌ Preencha todos os campos e envie a foto do personagem.",
                "error"
            );

            return;

        }


        /*
        Verifica se a combinação
        Personagem + Obra já está
        em uma vaga fechada.

        Exemplo:

        Gojo + Jujutsu Kaisen
        bloqueia apenas essa combinação.
        */


        if(vagasCarregadas){

            const vaga =
                encontrarVaga(
                    personagem,
                    obra
                );


            if(
                vaga &&
                String(
                    vaga.status || ""
                ).toLowerCase()
                === "fechada"
            ){

                mostrarMensagem(
                    `🔒 ${personagem} — ${obra} já está fechado e não pode ser escolhido.`,
                    "error"
                );

                return;

            }

        }


        submitBtn.disabled =
            true;

        submitBtn.textContent =
            "🎃 Enviando...";


        try{

            /*
            Comprime a foto antes
            de enviar para o Firebase.
            */

            const fotoData =
                await comprimirImagem(
                    foto
                );


            /*
            Limite de segurança
            para o documento do Firestore.
            */

            if(
                fotoData.length >
                600000
            ){

                throw new Error(
                    "PHOTO_TOO_LARGE"
                );

            }


            /*
            Cria a ficha diretamente
            na coleção requests.

            NÃO existe mais:
            characterLocks
            transaction
            updateDoc
            deleteDoc
            */

            await addDoc(
                collection(
                    db,
                    "requests"
                ),
                {

                    nome:
                        nome,

                    idade:
                        idade,

                    personagem:
                        personagem,

                    obra:
                        obra,

                    foto:
                        fotoData,

                    status:
                        "pendente",

                    characterKey:
                        chavePersonagem(
                            personagem,
                            obra
                        ),

                    criadoEm:
                        serverTimestamp()

                }
            );


            /*
            Limpa a ficha.
            */

            form.reset();

            preview.src = "";

            preview.style.display =
                "none";


            mostrarMensagem(
                "🎃 Ficha enviada com sucesso! Aguarde a administração analisar sua entrada.",
                "success"
            );


        }catch(error){

            console.error(
                "Erro ao enviar ficha:",
                error
            );


            if(
                error.message ===
                "PHOTO_TOO_LARGE"
            ){

                mostrarMensagem(
                    "❌ A foto ficou muito grande. Escolha outra imagem.",
                    "error"
                );

            }else if(
                error.message ===
                "PHOTO_ERROR"
            ){

                mostrarMensagem(
                    "❌ Não foi possível processar a foto. Tente outra imagem.",
                    "error"
                );

            }else{

                mostrarMensagem(
                    "❌ Não foi possível enviar sua ficha. Tente novamente.",
                    "error"
                );

            }

        }finally{

            submitBtn.disabled =
                false;

            submitBtn.textContent =
                "🎃 Enviar ficha";

        }

    }
);


/* =========================
   INICIAR
========================= */

carregarVagas();

    </script>
