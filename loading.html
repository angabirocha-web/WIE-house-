<!DOCTYPE html> <html lang="pt-BR"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0" > <title>House WIE</title> <style> * { margin: 0; padding: 0; box-sizing: border-box; } html, body { width: 100%; height: 100%; overflow: hidden; background: #000; } body { font-family: Arial, Helvetica, sans-serif; } /* ========================= TELA INTEIRA ========================= */ .loading-screen { position: fixed; inset: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #000; overflow: hidden; } /* ========================= VÍDEO DO FREDDY ========================= */ #video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; } /* ========================= ESCURECIMENTO ========================= */ .overlay { position: absolute; inset: 0; background: rgba(0, 0, 0, 0.45); z-index: 2; } /* ========================= CONTEÚDO ========================= */ .content { position: relative; z-index: 3; width: 90%; max-width: 500px; text-align: center; color: white; animation: aparecer 1.2s ease; } .title { font-size: clamp(42px, 11vw, 80px); font-weight: 900; letter-spacing: 8px; text-shadow: 0 0 10px rgba(255,255,255,.8), 0 0 30px rgba(255,255,255,.4); margin-bottom: 12px; } .subtitle { font-size: 12px; letter-spacing: 4px; text-transform: uppercase; opacity: .85; margin-bottom: 35px; } .loading-text { font-size: 13px; letter-spacing: 3px; text-transform: uppercase; margin-bottom: 14px; } /* ========================= BARRA ========================= */ .bar { width: 100%; height: 4px; background: rgba(255,255,255,.25); border-radius: 50px; overflow: hidden; } .bar-fill { width: 0%; height: 100%; background: #fff; box-shadow: 0 0 12px rgba(255,255,255,.9); animation: carregar 5s linear forwards; } .hint { margin-top: 14px; font-size: 10px; letter-spacing: 1px; opacity: .55; } /* ========================= ANIMAÇÕES ========================= */ @keyframes aparecer { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } } @keyframes carregar { from { width: 0%; } to { width: 100%; } } /* ========================= RESPONSIVO ========================= */ @media (max-width: 600px) { .title { letter-spacing: 5px; } .subtitle { font-size: 9px; } .content { width: 84%; } } </style> </head> <body> <div class="loading-screen"> <!-- VÍDEO DO JUMPSCARE O arquivo precisa se chamar: freddy.mp4 E ficar na mesma pasta deste arquivo. --> <video id="video" autoplay muted playsinline preload="auto" > <source src="freddy.mp4" type="video/mp4" > </video> <div class="overlay"></div> <div class="content"> <div class="title"> HOUSE WIE </div> <div class="subtitle"> Área de Administração </div> <div class="loading-text"> Carregando... </div> <div class="bar"> <div class="bar-fill"></div> </div> <div class="hint"> Preparando o painel </div> </div> </div> <script> const video = document.getElementById("video"); /* Inicia o vídeo automaticamente. */ video.play().catch(() => { console.log( "Autoplay bloqueado pelo navegador." ); }); /* Depois de 5 segundos, abre a área de administração. */ setTimeout(() => { window.location.href = "admin.html"; }, 5000); </script> </body> </html>
